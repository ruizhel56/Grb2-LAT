<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Single-Molecule Association</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  video{width:100vw;height:100vh;object-fit:contain;background:#fff}
  #play{position:fixed;inset:0;display:none;align-items:center;justify-content:center;border:0;background:rgba(255,255,255,.94);color:#111;font:600 20px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
</head>
<body>
<video id="video" autoplay muted loop playsinline preload="auto">
  <source src="animation2.mp4" type="video/mp4">
</video>
<button id="play" type="button">Tap to play</button>
<script>
const v=document.getElementById('video'), b=document.getElementById('play');
async function play(){try{await v.play();b.style.display='none'}catch(e){b.style.display='flex'}}
b.addEventListener('click',play); document.addEventListener('visibilitychange',()=>{if(!document.hidden)play()}); play();
</script>
</body>
</html>
